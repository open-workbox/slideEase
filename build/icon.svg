<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>PPT 编辑器图标</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <!-- 接触阴影：笔尖处实、向笔尾淡出 -->
    <linearGradient id="shGrad" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.16"/>
      <stop offset="0.22" stop-color="#0F172A" stop-opacity="0.05"/>
      <stop offset="0.42" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 装饰气泡 -->
    <circle cx="72" cy="64" r="9" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="114" cy="38" r="5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="448" cy="440" r="11" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="470" cy="398" r="6" fill="#FFFFFF" opacity="0.25"/>
    <!-- 卡片投影 -->
    <rect x="102" y="156" width="340" height="252" rx="28" fill="#0F172A" opacity="0.16"/>
    <!-- 幻灯片卡片 -->
    <rect x="86" y="140" width="340" height="252" rx="28" fill="#FFFFFF"/>
    <rect x="114" y="168" width="140" height="20" rx="10" fill="#4F46E5"/>
    <circle cx="300" cy="178" r="10" fill="#F97316"/>
    <rect x="114" y="206" width="150" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="114" y="232" width="130" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="306" y="316" width="26" height="48" rx="6" fill="#22D3EE"/>
    <rect x="348" y="296" width="26" height="68" rx="6" fill="#4F46E5"/>
    <rect x="390" y="326" width="26" height="38" rx="6" fill="#818CF8"/>
    <!-- 柔和投影（两层纯形状叠出「虚化」感，零滤镜） -->
    <g transform="translate(216,390) rotate(225)" fill="#0F172A" opacity="0.08"
       stroke="#0F172A" stroke-width="20" stroke-linejoin="round">
      <path d="M0 0 L-29 56 L29 56 Z"/>
      <rect x="-29" y="54" width="58" height="266"/>
      <rect x="-29" y="318" width="58" height="20"/>
      <path d="M-29 336 H29 V366 Q29 380 15 380 H-15 Q-29 380 -29 366 Z"/>
    </g>
    <g transform="translate(207,381) rotate(225)" fill="#0F172A" opacity="0.12"
       stroke="#0F172A" stroke-width="6" stroke-linejoin="round">
      <path d="M0 0 L-29 56 L29 56 Z"/>
      <rect x="-29" y="54" width="58" height="266"/>
      <rect x="-29" y="318" width="58" height="20"/>
      <path d="M-29 336 H29 V366 Q29 380 15 380 H-15 Q-29 380 -29 366 Z"/>
    </g>
    <!-- 接触阴影 -->
    <g transform="translate(213,381) rotate(225)" fill="url(#shGrad)">
      <path d="M0 0 L-29 56 L29 56 Z"/>
      <rect x="-29" y="54" width="58" height="266"/>
      <rect x="-29" y="318" width="58" height="20"/>
      <path d="M-29 336 H29 V366 Q29 380 15 380 H-15 Q-29 380 -29 366 Z"/>
    </g>
    <!-- 笔：垫底描边层（形成细示意轮廓，不依赖 paint-order） -->
    <g transform="translate(199,367) rotate(225)" fill="#334155"
       stroke="#334155" stroke-width="8" stroke-linejoin="round">
      <path d="M0 0 L-29 56 L29 56 Z"/>
      <rect x="-29" y="54" width="58" height="266"/>
      <rect x="-29" y="318" width="58" height="20"/>
      <path d="M-29 336 H29 V366 Q29 380 15 380 H-15 Q-29 380 -29 366 Z"/>
    </g>
    <!-- 笔：彩色填充层（盖在描边层之上，轮廓只露出四周细线） -->
    <g transform="translate(199,367) rotate(225)">
      <path d="M0 0 L-29 56 L29 56 Z" fill="#FDBA74"/>
      <path d="M0 0 L-9.5 20 L9.5 20 Z" fill="#334155"/>
      <rect x="-29" y="54" width="58" height="266" fill="url(#pen)"/>
      <rect x="-29" y="318" width="58" height="20" fill="#CBD5E1"/>
      <path d="M-29 336 H29 V366 Q29 380 15 380 H-15 Q-29 380 -29 366 Z" fill="#FB7185"/>
      <rect x="-21" y="62" width="8" height="248" rx="4" fill="#FFFFFF" opacity="0.3"/>
    </g>
  </g>
</svg>
