name: Release

# 推送 v 开头的 tag（如 v0.6.0）时，在三大平台各自构建并发布到同一个 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # 也可在 Actions 页面手动触发（只构建，不发布）

permissions:
  contents: write # 发布 Release 需要写权限

# 同一个 tag 重复推送时，取消还没跑完的旧构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22 # Node 20 已于 2026-04 停止维护
          cache: npm

      # tag 和 package.json 里的版本号不一致时直接失败，避免发出版本号错误的安装包
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG} 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # electron-builder 按当前 runner 的系统出对应平台的包。
      # 未配置签名证书，因此 Windows / macOS 产物为未签名版本。
      - name: Build ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # 改成普通用户一看就懂的文件名，并且不带版本号：
      # 这样 https://github.com/<仓库>/releases/latest/download/<文件名> 永远指向最新版，官网可以直接放下载链接
      - name: Rename for users
        shell: bash
        run: |
          mkdir -p out
          for f in dist/*; do
            case "$f" in
              *__uninstaller*)    ;; # electron-builder 的中间文件，不发布
              *-Setup-*.exe)      cp "$f" out/SlideEase-Windows-Installer.exe ;;
              *-win-x64.zip)      cp "$f" out/SlideEase-Windows-Portable.zip ;;
              *-mac-arm64.dmg)    cp "$f" out/SlideEase-macOS-Apple-Silicon.dmg ;;
              *-mac-x64.dmg)      cp "$f" out/SlideEase-macOS-Intel.dmg ;;
              *.AppImage)         cp "$f" out/SlideEase-Linux.AppImage ;;
              *.deb)              cp "$f" out/SlideEase-Linux.deb ;;
            esac
          done
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          # 只收集给用户下载的安装包；软件自己的更新提示不依赖 latest.yml / blockmap，不需要上传
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # 某个平台构建失败（例如 GitHub 的 macOS 机器排不上队）时，其它平台的包照样发布；
    # 之后在 Actions 页面“Re-run failed jobs”，补上的安装包会追加到同一个 Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 放在自动生成的更新说明前面：告诉普通用户该下载哪个文件
          body: |
            ## 下载哪个？ / Which file should I download?

            | 你的电脑 / Your computer | 下载这个 / Download |
            |---|---|
            | Windows（推荐） | **SlideEase-Windows-Installer.exe** 双击安装 / installer |
            | Windows 免安装 / portable | SlideEase-Windows-Portable.zip 解压即用 / unzip and run |
            | Mac：Apple 芯片（M1 / M2 / M3 / M4…） | **SlideEase-macOS-Apple-Silicon.dmg** |
            | Mac：Intel 芯片 | SlideEase-macOS-Intel.dmg |
            | Linux | SlideEase-Linux.AppImage，或 Debian / Ubuntu 用 SlideEase-Linux.deb |

            不确定 Mac 是哪种芯片：点左上角的苹果菜单 → 关于本机，“芯片”一栏写着 Apple M 开头就是 Apple 芯片。
            Not sure which Mac you have? Apple menu → About This Mac. "Chip: Apple M…" means Apple Silicon.

            安装时被系统拦截？看 [安装说明](https://7na7.com/install.html)。 / Blocked by a warning? See the [install guide](https://7na7.com/install.html).

            ---

